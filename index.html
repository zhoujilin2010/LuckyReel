<!DOCTYPE html>

<title>LuckyReel · 摇号选号</title>
<style>
  /* ── 街机 ARCADE 霓虹调色板（按 WCAG 2.2 AA 校色）── */
  :root{
    --bg:#0A0E1C; --panel:#1A2249; --panel2:#232E63;
    --ink:#FFFFFF; --dim:#C9D2EE;
    --red:#FF2D55; --blue:#00E5FF; --yellow:#FFD400; --green:#39FF88; --purple:#B14BFF;
    --line:2px solid rgba(0,229,255,.30);
    --shadow:0 0 0 1px rgba(0,229,255,.16), 0 0 22px rgba(0,229,255,.10);
    --arcade:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --num:"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:var(--arcade);
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center;
    overscroll-behavior:none; position:relative; overflow-x:hidden;
  }
  /* 装饰①：流动网格 + 像素点阵（内容之下，绝不拦截点击） */
  body::before{
    content:""; position:fixed; inset:-50% -50%; z-index:0; pointer-events:none;
    background:
      linear-gradient(rgba(0,229,255,.13) 1px,transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg,rgba(0,229,255,.13) 1px,transparent 1px) 0 0/40px 40px,
      radial-gradient(rgba(177,75,255,.20) 1px,transparent 1.6px) 0 0/20px 20px;
    animation:gridflow 12s linear infinite; will-change:transform;
  }
  /* 装饰②：CRT 扫描线 + 霓虹光晕 + 暗角（背景层，安全） */
  body::after{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),
      radial-gradient(60% 40% at 50% 0%, rgba(177,75,255,.28), transparent 70%),
      radial-gradient(55% 38% at 50% 100%, rgba(0,229,255,.22), transparent 70%),
      radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%);
    animation:flicker 4s steps(2,end) infinite;
  }
  @keyframes gridflow{from{transform:translate3d(0,0,0);}to{transform:translate3d(40px,40px,0);}}
  @keyframes flicker{0%,100%{opacity:.92;}50%{opacity:1;}}

  .app{
    width:100%; max-width:480px;
    /* 固定视口高度：header 固定 + view 内部滚动，保证摇奖机页两区始终在视口内 */
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; position:relative; z-index:1;
    background:transparent;
    padding:env(safe-area-inset-top) 14px calc(14px + env(safe-area-inset-bottom));
    /* 容器在桌面端居中并扩宽；手机保持 480px 单列 */
    margin:0 auto;
  }
  /* 装饰③：机柜左右霓虹立柱（贴 .app 内边，pointer-events:none，绝不挡点击/视觉不糊内容） */
  .app::before,.app::after{
    content:""; position:absolute; top:0; bottom:0; width:4px; z-index:1; pointer-events:none;
    background:linear-gradient(180deg,transparent,var(--blue),var(--purple),var(--blue),transparent);
    box-shadow:0 0 8px rgba(0,229,255,.55); opacity:.85; border-radius:2px;
  }
  .app::before{left:0;} .app::after{right:0;}

  /* ── 顶部霓虹招牌 ── */
  header{text-align:center; padding:14px 0 8px; position:relative; margin:0 0 4px;}
  header::before{ /* 招牌外框 */
    content:""; position:absolute; inset:0 -4px -2px; border-radius:14px; pointer-events:none;
    border:2px solid rgba(255,45,85,.6);
    box-shadow:0 0 24px rgba(255,45,85,.38), inset 0 0 24px rgba(255,45,85,.14);
  }
  header::after{ /* 招牌顶部灯泡串 */
    content:""; position:absolute; left:16px; right:16px; top:5px; height:5px; pointer-events:none;
    background:radial-gradient(circle at 4px 2.5px, var(--yellow) 0 2.4px, transparent 2.8px) 0 0/15px 5px;
    animation:bulbs 1.6s steps(2,end) infinite;
  }
  @keyframes bulbs{0%,100%{opacity:1;}50%{opacity:.4;}}
  header h1{
    margin:0; padding-top:6px; font-size:24px; font-weight:900; letter-spacing:2px; font-family:var(--num);
    color:#fff;
    text-shadow:0 0 6px var(--red),0 0 18px var(--red),0 0 36px rgba(255,45,85,.65),0 0 62px rgba(177,75,255,.5);
    animation:neonPulse 2.4s ease-in-out infinite;
  }
  @keyframes neonPulse{0%,100%{opacity:1;}50%{opacity:.85;}}
  header p{margin:8px 0 0; font-size:12px; color:var(--dim); letter-spacing:1px;}

  /* 装饰④：像素风投币口 */
  .slot{
    width:84px; height:26px; margin:12px auto 0; position:relative;
    border-radius:6px; border:2px solid #5A6592;
    background:linear-gradient(180deg,#2E3866,#151B36);
    box-shadow:0 3px 0 #05070F, inset 0 2px 6px rgba(0,0,0,.85);
    display:flex; align-items:center; justify-content:center;
  }
  .slot::before{ /* 投币缝隙 */
    content:""; width:50px; height:7px; border-radius:4px; background:#04060E;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.16);
  }
  .slot::after{ /* 指示灯 */
    content:""; position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%; background:var(--red);
    box-shadow:0 0 10px var(--red); animation:blink 1.15s steps(2,end) infinite;
  }
  .coin{
    margin:9px auto 0; display:block; font-family:var(--num);
    font-size:13px; font-weight:900; letter-spacing:4px; color:var(--yellow);
    text-shadow:0 0 14px rgba(255,212,0,.9), 0 1px 2px rgba(0,0,0,.7);
    animation:blink 1.15s steps(2,end) infinite;
  }
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:.35;}}

  /* view 占满剩余高度并内部滚动（设置页/结果页靠它滚动） */
  .view{
    display:none; flex:1 1 auto; min-height:0; flex-direction:column;
    gap:16px; padding-top:6px; overflow-y:auto; overscroll-behavior:contain;
  }
  .view.active{display:flex;}

  /* ══ 摇奖机页：上下两区固定布局（方案 A）══
     上区 .machine-top  固定：返回/进度/卷轴/摇杆/按钮
     下区 .machine-bottom 占满剩余并可独立滚动：本注号码 + 已摇出记录
     → 手机竖屏无需滚动即可看到完整号码区 */
  #machine.active{overflow:hidden; gap:10px; padding-top:4px;}
  .machine-top{
    flex:0 0 auto; display:flex; flex-direction:column; gap:8px;
  }
  .machine-bottom{
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    display:flex; flex-direction:column; gap:10px; padding-bottom:4px;
  }
  /* 按钮横排，省纵向空间 */
  .act-row{display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .act-row .auto-btn,.act-row .redo-btn{margin-top:0;}

  /* ── 通用按钮 / 街机实体按键 ── */
  .btn{
    font:inherit; font-weight:900; cursor:pointer; letter-spacing:1px;
    border:2px solid rgba(255,255,255,.30); border-radius:14px;
    background:linear-gradient(180deg,var(--panel2),var(--panel)); color:var(--ink);
    padding:14px 16px; box-shadow:0 5px 0 #05070F, 0 0 20px rgba(0,229,255,.14);
    transition:transform .06s, box-shadow .06s; user-select:none;
    position:relative; z-index:2;              /* 保证始终可点击 */
  }
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 #05070F, 0 0 12px rgba(0,229,255,.08);}
  .btn.primary{background:linear-gradient(180deg,#FF7A93,var(--red)); color:#0B0E1A;
    border-color:rgba(255,255,255,.55); box-shadow:0 5px 0 #6E0018, 0 0 28px rgba(255,45,85,.55);}
  .btn.primary:active{box-shadow:0 1px 0 #6E0018, 0 0 16px rgba(255,45,85,.4);}
  .btn.yellow{background:linear-gradient(180deg,#FFEE97,var(--yellow)); color:#0B0E1A;
    box-shadow:0 5px 0 #7A6600, 0 0 26px rgba(255,212,0,.45);}
  .btn.yellow:active{box-shadow:0 1px 0 #7A6600, 0 0 14px rgba(255,212,0,.35);}
  .btn.blue{background:linear-gradient(180deg,#93F7FF,var(--blue)); color:#04121A;
    box-shadow:0 5px 0 #005A66, 0 0 28px rgba(0,229,255,.5);}
  .btn.blue:active{box-shadow:0 1px 0 #005A66, 0 0 16px rgba(0,229,255,.4);}
  .btn.block{width:100%; font-size:19px; padding:18px;}
  .btn:disabled{opacity:.45; box-shadow:0 5px 0 #05070F; transform:none; cursor:not-allowed;}

  .card{
    background:linear-gradient(180deg,rgba(35,46,99,.96),rgba(26,34,73,.96));
    border:2px solid rgba(0,229,255,.34); border-radius:16px;
    box-shadow:0 0 24px rgba(0,229,255,.14), inset 0 0 28px rgba(0,229,255,.07);
    padding:16px; position:relative;
  }
  .card::before{ /* 装饰⑤：四角螺丝 */
    content:""; position:absolute; inset:5px; border-radius:12px; pointer-events:none;
    background:
      radial-gradient(circle at 5px 5px, rgba(0,229,255,.65) 0 2.4px, transparent 2.8px),
      radial-gradient(circle at calc(100% - 5px) 5px, rgba(0,229,255,.65) 0 2.4px, transparent 2.8px),
      radial-gradient(circle at 5px calc(100% - 5px), rgba(0,229,255,.65) 0 2.4px, transparent 2.8px),
      radial-gradient(circle at calc(100% - 5px) calc(100% - 5px), rgba(0,229,255,.65) 0 2.4px, transparent 2.8px);
  }
  .card::after{ /* 装饰⑥：顶部呼吸灯带 */
    content:""; position:absolute; left:12px; right:12px; top:3px; height:2px; border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--blue),transparent); pointer-events:none;
    animation:strip 2.8s ease-in-out infinite;
  }
  @keyframes strip{0%,100%{opacity:.35;}50%{opacity:1;}}
  .section-title{font-weight:900; font-size:13px; margin:0 0 10px; color:#7DF3FF;
    letter-spacing:2px; text-shadow:0 0 12px rgba(0,229,255,.7), 0 1px 2px rgba(0,0,0,.6);}

  /* ── 彩种选择 ── */
  .lottery-row{display:flex; gap:10px;}
  .lottery-row .btn{flex:1; padding:18px 8px; font-size:16px;}
  .lottery-row .btn.on{
    background:linear-gradient(180deg,#7BF5FF,var(--blue)); color:#04121A;
    border-color:#CFFAFF; outline:2px solid #CFFAFF; outline-offset:2px;
    box-shadow:0 5px 0 #005A66, 0 0 32px rgba(0,229,255,.7);
  }

  /* ── 玩法 ── */
  .chip-row{display:flex; gap:10px; flex-wrap:wrap;}
  .chip{
    font:inherit; font-weight:800; cursor:pointer; border:2px solid rgba(255,255,255,.32);
    border-radius:999px; background:rgba(255,255,255,.14); color:var(--ink);
    padding:9px 16px; box-shadow:0 3px 0 #05070F; transition:transform .06s;
    position:relative; z-index:2;            /* 保证始终可点击 */
  }
  .chip:active{transform:translateY(3px); box-shadow:0 0 0 #05070F;}
  .chip.on{
    background:linear-gradient(180deg,#FFE97A,var(--yellow)); color:#0B0E1A;
    border-color:#FFF6C2; outline:2px solid #FFF6C2; outline-offset:2px;
    box-shadow:0 3px 0 #7A6600, 0 0 24px rgba(255,212,0,.6);
  }
  .pick-row{display:flex; gap:8px; flex-wrap:wrap;}

  /* ── 步进器 ── */
  .stepper{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:10px 0;}
  .stepper .label{font-weight:800; color:var(--dim);}
  .stepper .ctrl{display:flex; align-items:center; gap:12px;}
  .stepper .val{min-width:40px; text-align:center; font-weight:900; font-size:24px;
    font-family:var(--num); color:var(--green); text-shadow:0 0 16px rgba(57,255,136,.7);}
  .round{
    width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,255,255,.32);
    background:linear-gradient(180deg,var(--panel2),var(--panel)); color:var(--ink);
    font-size:22px; font-weight:900; cursor:pointer; position:relative; z-index:2;
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 #05070F;
  }
  .round:active{transform:translateY(3px); box-shadow:0 0 0 #05070F;}
  .round:disabled{opacity:.4;}
  .hint{font-size:12px; color:var(--dim); margin-top:4px;}

  /* ── 摇奖机 ── */
  .topbar{display:flex; align-items:center; justify-content:space-between;}
  .back{font:inherit; font-weight:800; cursor:pointer; position:relative; z-index:2;
        border:2px solid rgba(255,255,255,.32); border-radius:10px;
        background:rgba(255,255,255,.14); color:var(--ink); padding:8px 12px; box-shadow:0 3px 0 #05070F;}
  .back:active{transform:translateY(3px); box-shadow:0 0 0 #05070F;}
  .head-name{font-weight:900; font-size:15px; text-align:center; flex:1; color:var(--yellow);
    letter-spacing:1px; text-shadow:0 0 14px rgba(255,212,0,.55);}

  /* 计分板式进度条 */
  .progress{text-align:center; font-weight:900; font-size:14px; font-family:var(--num);
    letter-spacing:2px; color:var(--green);
    background:rgba(0,0,0,.45); border:2px solid rgba(57,255,136,.35); border-radius:10px;
    padding:8px 10px; text-shadow:0 0 12px rgba(57,255,136,.75);
    box-shadow:inset 0 0 18px rgba(57,255,136,.12);}

  .machine{
    flex:0 0 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:clamp(5px, 1.4vmin, 12px);
    padding:clamp(2px, 0.8vmin, 6px) 0 clamp(2px, 0.8vmin, 6px);
  }
  .reel{
    width:clamp(120px, 26vmin, 200px);
    height:clamp(120px, 26vmin, 200px);
    border-radius:clamp(12px, 3vmin, 22px);
    position:relative; overflow:hidden;
    border:3px solid rgba(0,229,255,.55);
    background:radial-gradient(120% 120% at 50% 0%,#10203A,#05070F 72%);
    box-shadow:0 0 0 4px #05070F, 0 0 26px rgba(0,229,255,.45), inset 0 0 30px rgba(0,229,255,.15);
    display:flex; align-items:center; justify-content:center;
    animation:reelBreath 2.6s ease-in-out infinite;
    flex:0 0 auto;
  }
  @keyframes reelBreath{
    0%,100%{box-shadow:0 0 0 4px #05070F,0 0 20px rgba(0,229,255,.32),inset 0 0 30px rgba(0,229,255,.12);}
    50%{box-shadow:0 0 0 4px #05070F,0 0 42px rgba(0,229,255,.75),inset 0 0 36px rgba(0,229,255,.24);}
  }
  .reel::before{content:""; position:absolute; inset:6px; border-radius:14px;
    background:repeating-linear-gradient(0deg,rgba(0,229,255,.05) 0 14px,rgba(0,0,0,.28) 14px 28px);}
  .reel::after{content:""; position:absolute; left:0; right:0; top:0; height:42%;
    background:linear-gradient(180deg,rgba(255,255,255,.13),transparent); pointer-events:none;}
  #reelNum{
    position:relative;
    font-size:clamp(40px, 10vmin, 84px);
    font-weight:900; font-family:var(--num);
    color:#EAFBFF; font-variant-numeric:tabular-nums; letter-spacing:2px;
    text-shadow:0 0 8px var(--blue),0 0 24px rgba(0,229,255,.75),0 0 48px rgba(0,229,255,.45);
  }
  .reel.spinning #reelNum{animation:roll .1s linear infinite; color:#fff;}
  @keyframes roll{
    0%{filter:blur(0); transform:translateY(-10px) scaleY(1.06);}
    50%{filter:blur(2.5px); transform:translateY(10px) scaleY(.94);}
    100%{filter:blur(0); transform:translateY(-10px) scaleY(1.06);}
  }
  /* 开奖：弹跳 + 爆闪 */
  .reel.landed{animation:pop .4s ease, flash .45s ease;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.14) rotate(-3deg);}100%{transform:scale(1);}}
  @keyframes flash{
    0%{box-shadow:0 0 0 4px #05070F,0 0 90px rgba(255,255,255,.95),inset 0 0 60px rgba(255,255,255,.85);}
    100%{box-shadow:0 0 0 4px #05070F,0 0 26px rgba(0,229,255,.45),inset 0 0 30px rgba(0,229,255,.15);}
  }
  /* 开奖瞬间整机震动 */
  .machine:has(.reel.landed){animation:shake .4s ease;}
  @keyframes shake{
    0%,100%{transform:translate3d(0,0,0);}
    20%{transform:translate3d(-5px,2px,0) rotate(-.6deg);}
    40%{transform:translate3d(5px,-2px,0) rotate(.6deg);}
    60%{transform:translate3d(-4px,1px,0) rotate(-.4deg);}
    80%{transform:translate3d(3px,-1px,0) rotate(.3deg);}
  }

  .lever{
    width:100%; max-width:320px; border:none; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:0;
    position:relative; z-index:5;            /* 顶层，确保 PULL 永远可点 */
    pointer-events:auto;
    flex:0 0 auto;
  }
  .lever .knob{pointer-events:auto;}
  .lever .knob{
    width:clamp(72px, 16vmin, 100px);
    height:clamp(72px, 16vmin, 100px);
    border-radius:50%;
    border:3px solid rgba(255,255,255,.55);
    background:radial-gradient(60% 60% at 35% 28%,#FF9AAC,var(--red) 58%,#A8001E);
    color:#fff; font-size:clamp(14px, 3.4vmin, 24px); font-weight:900; font-family:var(--num); letter-spacing:1px;
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 8px 0 #6E0018, 0 0 34px rgba(255,45,85,.6), inset 0 -6px 10px rgba(0,0,0,.35);
    animation:knobIdle 1.9s ease-in-out infinite;
    transition:transform .08s, box-shadow .08s;
  }
  @keyframes knobIdle{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  /* 待机脉冲光环 */
  .lever .knob::after{
    content:""; position:absolute; inset:-10px; border-radius:50%;
    border:2px solid rgba(255,45,85,.6); animation:ring 1.9s ease-out infinite;
  }
  @keyframes ring{0%{transform:scale(.92); opacity:.85;}100%{transform:scale(1.4); opacity:0;}}
  .lever:active .knob{
    transform:translateY(8px);
    box-shadow:0 2px 0 #6E0018, 0 0 20px rgba(255,45,85,.55), inset 0 -6px 10px rgba(0,0,0,.35);
  }
  .lever .cap{font-weight:800; font-size:clamp(11px, 2.6vmin, 13px); color:var(--dim); letter-spacing:1px;}

  .auto-btn{align-self:center; font:inherit; font-weight:900; cursor:pointer;
    border:2px solid rgba(255,255,255,.45); border-radius:999px; position:relative; z-index:5;
    background:linear-gradient(180deg,#FFE97A,var(--yellow)); color:#0B0E1A;
    padding:clamp(8px, 2vmin, 12px) clamp(18px, 4.5vmin, 24px);
    font-size:clamp(14px, 3.4vmin, 16px);
    box-shadow:0 4px 0 #7A6600, 0 0 24px rgba(255,212,0,.55);
    pointer-events:auto; flex:0 0 auto;}
  .auto-btn:active{transform:translateY(4px); box-shadow:0 0 0 #7A6600, 0 0 14px rgba(255,212,0,.4);}
  .redo-btn{margin-top:2px; align-self:center; font:inherit; font-weight:900; cursor:pointer;
    border:2px solid rgba(255,255,255,.45); border-radius:999px; position:relative; z-index:5;
    background:linear-gradient(180deg,#FF6B85,var(--red)); color:#0B0E1A;
    padding:clamp(9px, 2.2vmin, 13px) clamp(22px, 5.5vmin, 28px);
    font-size:clamp(14px, 3.6vmin, 17px);
    box-shadow:0 4px 0 #6E0018, 0 0 24px rgba(255,45,85,.55);
    pointer-events:auto; flex:0 0 auto;}
  .redo-btn:active{transform:translateY(4px); box-shadow:0 0 0 #6E0018, 0 0 14px rgba(255,45,85,.4);}

  /* ── 本注托盘 ── */
  .tray{display:flex; flex-direction:column; gap:12px;}
  .tray:empty + .tray-hint{display:flex;}
  .tray:not(:empty) + .tray-hint{display:none;}
  .tray-hint{display:none; align-items:center; justify-content:center;
    text-align:center; padding:30px 16px; font-weight:800; font-size:15px;
    color:var(--dim); letter-spacing:1px;

<script>
"use strict";
/* ============================================================
   随机性基底：移植自 DestinyDraw 的「物理摇奖机」模型
   - secureRandomInt() 基于 crypto.getRandomValues（消除取模偏差）
   - 每次抽球 = 对剩余球池多轮洗牌后取 1 枚（不放回）
   ============================================================ */
const _buf = new Uint32Array(1);
function secureRandomInt(maxExclusive){
  if(!Number.isInteger(maxExclusive) || maxExclusive <= 0) throw new Error('maxExclusive 必须是正整数');
  const maxU = 0x100000000;
  const limit = maxU - (maxU % maxExclusive);
  for(;;){
    _buf[0] = 0;
    crypto.getRandomValues(_buf);
    if(_buf[0] < limit) return _buf[0] % maxExclusive;
  }
}
function shuffleInPlace(arr, rounds){
  const r = rounds || Math.max(8, arr.length);
  for(let k=0;k<r;k++){
    for(let i=arr.length-1;i>0;i--){
      const j = secureRandomInt(i+1);
      const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
  }
}
// 从球池（原地）抽取 1 枚并不放回
function drawOne(pool){
  shuffleInPlace(pool, Math.max(6, pool.length));
  return pool.pop();
}
const pad = n => String(n).padStart(2,'0');

/* ── 彩种配置 ── */
const LOTTERIES = {
  ssq:{
    name:'双色球',
    groups:[ {key:'red',label:'红球',min:1,max:33,color:'#E60012',base:6,cap:20},
             {key:'blue',label:'蓝球',min:1,max:16,color:'#0078F0',base:1,cap:8} ]
  },
  dlt:{
    name:'大乐透',
    groups:[ {key:'front',label:'前区',min:1,max:35,color:'#E60012',base:5,cap:20},
             {key:'back',label:'后区',min:1,max:12,color:'#0078F0',base:2,cap:8} ]
  },
  kl8:{
    name:'快乐8',
    groups:[ {key:'ball',label:'选号',min:1,max:80,color:'#E60012',base:5} ],
    pickMode:true
  }
};

/* ── 设置页状态 ── */
const setup = { lottery:'ssq', mode:'single', counts:{}, pick:5, extra:0, bets:1 };
function resetCounts(){
  setup.counts = {};
  LOTTERIES[setup.lottery].groups.forEach(g => setup.counts[g.key] = g.base);
}
resetCounts();

/* ── 小工具 ── */
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function $(id){ return document.getElementById(id); }
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $(id).classList.add('active');
  // 同步 body class，CSS 按 view-mode-* 切换装饰/压缩 header
  document.body.className = 'view-mode-' + id;
}
function toast(msg){
  const t = el('div','toast',msg); $('toastBox').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),250); }, 1800);
}

/* ── 渲染设置页 ── */
function renderSetup(){
  // 彩种
  const lr = $('lotteryRow'); lr.innerHTML='';
  Object.keys(LOTTERIES).forEach(k=>{
    const b = el('button','btn'+(setup.lottery===k?' on':''), LOTTERIES[k].name);
    b.onclick = ()=>{ setup.lottery=k; setup.mode='single'; resetCounts();
      if(k==='kl8') setup.pick=5; setup.extra=0; renderSetup(); };
    lr.appendChild(b);
  });
  // 玩法
  const pa = $('playArea'); pa.innerHTML='';
  const L = LOTTERIES[setup.lottery];

  if(L.pickMode){
    // 快乐8：选N + 单式/复式
    pa.appendChild(el('div','hint','选择「选几」'));
    const pickRow = el('div','pick-row');
    for(let n=1;n<=10;n++){
      const c = el('button','chip'+(setup.pick===n?' on':''),'选'+n);
      c.onclick = ()=>{ setup.pick=n; setup.mode='single'; setup.extra=0; renderSetup(); };
      pickRow.appendChild(c);
    }
    pa.appendChild(pickRow);
    pa.appendChild(modeChips());
    if(setup.mode==='compound'){
      pa.appendChild(stepperEl('额外球数（复式）', ()=>setup.extra, v=>setup.extra=v, 0, 8));
      pa.appendChild(el('div','hint','即「选'+setup.pick+'」再加 '+setup.extra+' 球 = '+(setup.pick+setup.extra)+' 球/注'));
    }
  } else {
    pa.appendChild(modeChips());
    if(setup.mode==='compound'){
      L.groups.forEach(g=>{
        pa.appendChild(stepperEl(g.label+'（复式）', ()=>setup.counts[g.key], v=>setup.counts[g.key]=v, g.base, g.cap));
      });
    } else {
      const txt = L.groups.map(g=>g.label+' '+g.base+' 个').join(' + ');
      pa.appendChild(el('div','hint','单式：'+txt));
    }
  }
  $('betVal').textContent = setup.bets;
}
function modeChips(){
  const row = el('div','chip-row');
  ['single','compound'].forEach(m=>{
    const c = el('button','chip'+(setup.mode===m?' on':''), m==='single'?'单式':'复式');
    c.onclick = ()=>{ setup.mode=m; renderSetup(); };
    row.appendChild(c);
  });
  return row;
}
function stepperEl(label, get, set, min, max){
  const wrap = el('div','stepper');
  wrap.appendChild(el('span','label',label));
  const ctrl = el('div','ctrl');
  const minus = el('button','round','−');
  const val = el('span','val', String(get()));
  const plus = el('button','round','+');
  minus.disabled = get()<=min; plus.disabled = get()>=max;
  minus.onclick = ()=>{ if(get()>min){ set(get()-1); renderSetup(); } };
  plus.onclick  = ()=>{ if(get()<max){ set(get()+1); renderSetup(); } };
  ctrl.append(minus,val,plus); wrap.appendChild(ctrl);
  return wrap;
}

// 注数步进
$('betMinus').onclick = ()=>{ if(setup.bets>1){ setup.bets--; $('betVal').textContent=setup.bets; } };
$('betPlus').onclick  = ()=>{ if(setup.bets<50){ setup.bets++; $('betVal').textContent=setup.bets; } };

/* ── 构建本注抽球计划 ── */
function buildDrawPlan(){
  const L = LOTTERIES[setup.lottery];
  if(L.pickMode){
    const count = setup.pick + (setup.mode==='compound'? setup.extra : 0);
    return [ {key:'ball', label:'选号', color:L.groups[0].color, min:1, max:80, count} ];
  }
  return L.groups.map(g=>({ ...g, count: setup.counts[g.key] }));
}

/* ── 真实彩票注数（复式按组合数展开）── */
function nCr(n, r){
  if(r<0 || r>n) return 0;
  if(r===0 || r===n) return 1;
  r = Math.min(r, n-r);
  let res = 1;
  for(let i=1; i<=r; i++) res = res*(n-i+1)/i;
  return Math.round(res);
}
function sheetBets(){            // 单张选号单对应的真实注数
  const L = LOTTERIES[setup.lottery];
  if(L.pickMode){
    const n = setup.pick;
    const k = setup.pick + (setup.mode==='compound' ? setup.extra : 0);
    return nCr(k, n);
  }
  let bets = 1;
  L.groups.forEach(g => { bets *= nCr(setup.counts[g.key], g.base); });
  return bets;
}
function playName(){
  const L = LOTTERIES[setup.lottery];
  if(L.pickMode){
    const n=setup.pick, extra=setup.mode==='compound'?setup.extra:0;
    return extra>0 ? `选${n}复式${n+extra}` : `选${n}`;
  }
  const atBase = L.groups.every(g=>setup.counts[g.key]===g.base);
  if(atBase) return `单式${L.groups[0].base}+${L.groups[1].base}`;
  return `复式${L.groups.map(g=>setup.counts[g.key]).join('+')}`;
}

/* ── 摇奖状态机 ── */
const state = {
  phase:'setup', drawPlan:[], bets:1, header:'',
  currentBet:0, groupIdx:0, remaining:[], results:[],
  drawnInBet:0, totalPerBet:0, animating:false, spinTimer:null
};

function startMachine(){
  state.drawPlan = buildDrawPlan();
  state.bets = setup.bets;
  state.header = LOTTERIES[setup.lottery].name + ' · ' + playName();
  state.totalPerBet = state.drawPlan.reduce((s,g)=>s+g.count,0);
  state.results = Array.from({length:state.bets},()=>({}));
  state.currentBet = 0; state.phase='drawing';
  $('headName').textContent = state.header;
  showView('machine');
  startBet();
}
function startBet(){
  state.groupIdx = 0; state.drawnInBet = 0;
  state.remaining = state.drawPlan.map(g=>{
    const pool=[]; for(let i=g.min;i<=g.max;i++) pool.push(i); return pool;
  });
  $('reelNum').textContent='--';
  renderTray(); updateProgress(); renderDrawnLog();
}
function updateProgress(){
  $('progress').textContent = `第 ${state.currentBet+1}/${state.bets} 注 · 已摇 ${state.drawnInBet}/${state.totalPerBet} 球`;
}
function renderTray(){
  const tray=$('tray'); tray.innerHTML='';
  const bet = state.results[state.currentBet]||{};
  let anyBall = false;
  state.drawPlan.forEach(g=>{
    const wrap=el('div','tray-group');
    wrap.appendChild(el('div','tray-label',g.label));
    const balls=el('div','balls');
    (bet[g.key]||[]).forEach(n=>{
      const b=el('span','ball',pad(n)); b.style.background=g.color; balls.appendChild(b);
      anyBall = true;
    });
    wrap.appendChild(balls); tray.appendChild(wrap);
  });
  // 0 球时显示"拨动摇杆"提示，有球后自动隐藏
  const hint = document.getElementById('trayHint');
  if(hint) hint.style.display = anyBall ? 'none' : 'flex';
}
function renderDrawnLog(){
  const card=$('drawnCard'), log=$('drawnLog');
  const done=[];
  for(let i=0;i<state.currentBet;i++) done.push(state.results[i]);
  if(done.length===0){ card.style.display='none'; log.innerHTML=''; return; }
  card.style.display='';
  log.innerHTML='';
  done.forEach((bet,i)=>{
    const b=el('div','bet');
    b.appendChild(el('div','t','第 '+(i+1)+' 注'));
    state.drawPlan.forEach(g=>{
      const line=el('div','line');
      line.appendChild(el('span','tag',g.label));
      (bet[g.key]||[]).forEach(n=>{
        const ball=el('span','ball',pad(n)); ball.style.background=g.color;
        ball.style.width='30px'; ball.style.height='30px'; ball.style.fontSize='13px';
        line.appendChild(ball);
      });
      b.appendChild(line);
    });
    log.appendChild(b);
  });
}
function recordBall(key,num){
  const bet = state.results[state.currentBet];
  if(!bet[key]) bet[key]=[];
  bet[key].push(num); bet[key].sort((a,b)=>a-b);
}

/* ── 拨杆抽一号 ── */
function pull(){
  if(state.phase!=='drawing' || state.animating) return;
  const g = state.drawPlan[state.groupIdx];
  const pool = state.remaining[state.groupIdx];
  if(!pool || !pool.length) return;
  state.animating = true;
  const finalNum = drawOne(pool);
  spinReel(g, finalNum, ()=>{
    recordBall(g.key, finalNum);
    state.drawnInBet++;
    renderTray(); updateProgress();
    state.animating = false;
    checkAdvance();
  });
}
function spinReel(g, finalNum, done){
  const reel=$('reel'), numEl=$('reelNum');
  reel.classList.add('spinning');
  let ticks=0; const total=14;
  clearInterval(state.spinTimer);
  state.spinTimer=setInterval(()=>{
    numEl.textContent = pad(g.min + secureRandomInt(g.max-g.min+1));
    if(++ticks>=total){
      clearInterval(state.spinTimer);
      setTimeout(()=>{
        numEl.textContent = pad(finalNum);
        reel.classList.remove('spinning');
        reel.classList.add('landed');
        beep();
        setTimeout(()=>reel.classList.remove('landed'),400);
        done();
      },120);
    }
  },55);
}
function checkAdvance(){
  const g = state.drawPlan[state.groupIdx];
  if((state.results[state.currentBet][g.key]||[]).length >= g.count){
    state.groupIdx++;
    if(state.groupIdx >= state.drawPlan.length){
      if(state.currentBet < state.bets-1){
        toast('第 '+(state.currentBet+1)+' 注完成！');
        state.currentBet++;
        renderDrawnLog();
        setTimeout(startBet, 750);
      } else {
        finishAll();
      }
    }
  }
}
// 自动摇完本注（无动画，直接填满）
function autoFinishBet(){
  if(state.phase!=='drawing' || state.animating) return;
  while(state.groupIdx < state.drawPlan.length){
    const g = state.drawPlan[state.groupIdx];
    const pool = state.remaining[state.groupIdx];
    while((state.results[state.currentBet][g.key]||[]).length < g.count && pool.length){
      recordBall(g.key, drawOne(pool));
      state.drawnInBet++;
    }
    state.groupIdx++;
  }
  renderTray(); updateProgress();
  if(state.currentBet < state.bets-1){
    toast('第 '+(state.currentBet+1)+' 注完成！');
    state.currentBet++;
    renderDrawnLog();
    setTimeout(startBet, 400);
  } else {
    finishAll();
  }
}

/* ── 重摇本注：摇出不满意直接重来 ── */
function redoBet(){
  if(state.phase!=='drawing') return;
  clearInterval(state.spinTimer);
  state.animating=false;
  $('reel').classList.remove('spinning'); $('reel').classList.remove('landed');
  // 若当前注已摇满、正处在等待进入下一注的间隙，则回退到刚完成的这一注
  if(state.drawnInBet >= state.totalPerBet && state.groupIdx >= state.drawPlan.length){
    if(state.currentBet > 0) state.currentBet--;
  }
  state.results[state.currentBet] = {};
  renderDrawnLog();
  startBet();
  toast('已重摇第 '+(state.currentBet+1)+' 注');
}

/* ── 结果 ── */
function finishAll(){
  state.phase='done';
  renderResult();
  showView('result');
}
function renderResult(){
  const sheet=$('sheet'); sheet.innerHTML='';
  sheet.appendChild(el('h2',null, LOTTERIES[setup.lottery].name));
  sheet.appendChild(el('div','sub', playName() + ' · 共 '+state.bets+' 张'));
  state.results.forEach((bet,i)=>{
    const b=el('div','bet');
    b.appendChild(el('div','t', '第 '+(i+1)+' 注'));
    state.drawPlan.forEach(g=>{
      const line=el('div','line');
      line.appendChild(el('span','tag', g.label));
      (bet[g.key]||[]).forEach(n=>{
        const ball=el('span','ball',pad(n)); ball.style.background=g.color;
        ball.style.width='32px'; ball.style.height='32px'; ball.style.fontSize='14px';
        line.appendChild(ball);
      });
      b.appendChild(line);
    });
    sheet.appendChild(b);
  });
  const perSheet = sheetBets();
  const totalBets = perSheet * state.bets;
  const total = totalBets * 2;
  sheet.appendChild(el('div','sheet-total', '合计：¥' + total + '（共 ' + totalBets + ' 注 × 2 元）'));
}
function buildSheetText(){
  let t = LOTTERIES[setup.lottery].name + ' · ' + playName() + '\n';
  state.results.forEach((bet,i)=>{
    t += '第'+(i+1)+'注：';
    t += state.drawPlan.map(g=>(g.label+' '+(bet[g.key]||[]).map(pad).join(' '))).join(' | ');
    t += '\n';
  });
  const sheetTotalBets = sheetBets() * state.bets;
  t += '\n合计：¥' + (sheetTotalBets * 2) + '（共 ' + sheetTotalBets + ' 注 × 2 元）';
  return t.trim();
}
async function copySheet(){
  const text = buildSheetText();
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(_){}
    ta.remove();
  }
  toast('选号单已复制 ✓');
}

/* ── 轻微触感音（零依赖）── */
let actx=null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), gn=actx.createGain();
    o.type='square'; o.frequency.value=660; gn.gain.value=0.04;
    o.connect(gn); gn.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+0.08);
  }catch(e){}
}

/* ── 绑定 ── */
$('startBtn').onclick = startMachine;
$('lever').onclick = pull;
$('autoBtn').onclick = autoFinishBet;
$('redoBtn').onclick = redoBet;
$('backBtn').onclick = ()=>{ state.phase='setup'; showView('setup'); };
$('againBtn').onclick = ()=>{ state.phase='setup'; renderSetup(); showView('setup'); };
$('copyBtn').onclick = copySheet;

renderSetup();
</script>
